# Settings for the soilgsd pipeline. Override any field on the command line.

# Folder holding the official competition files (see README: make download).
data_root: data/raw
artifacts: artifacts

# Default model for `soilgsd submit`. See `soilgsd describe` for the choices.
# knn with 5 neighbours on the texture features was the only configuration that
# held up when the camera changed - see docs/FINDINGS.md.
model: knn

# Which features a model may see. "texture" drops colour and meta_* columns,
# which encode the camera rather than the soil and do not transfer from the
# Motorola/Samsung training photos to the iPhone test photos.
feature_set: texture

# Grouped cross-validation. With only 24 training samples, 24 splits means
# leave-one-out, which is the most data each fold can get.
n_splits: 24
group_pattern: null

features:
  # Every photo is resampled to this many pixels per millimetre before analysis,
  # so one pixel means the same physical length whichever camera took the shot.
  target_ppm: 4.0
  # Analysis window: 256 px at 4 px/mm is a 64 mm square of ground.
  crop_px: 256
  crop_grid: 3
  # Pyramid levels; level l probes a physical scale of (1 / target_ppm) * 2**l mm,
  # so 7 levels span 0.25 mm to 16 mm.
  n_levels: 7
  max_side_px: 2048
  # Used when a photo has no row in ppm_updated.csv.
  default_ppm: 4.0
