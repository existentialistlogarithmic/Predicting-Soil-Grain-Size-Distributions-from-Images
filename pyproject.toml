[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soilgsd"
version = "0.1.0"
description = "Predicting soil grain size distributions from photographs (Kaggle: soil-grain-size-from-photos)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
vision = ["torch>=2.1", "torchvision>=0.16"]

[project.scripts]
soilgsd = "soilgsd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
